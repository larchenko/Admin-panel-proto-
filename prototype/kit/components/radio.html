<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio · Atoms · VIZ 2.0 Back office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/kit.css">
  <script src="../../assets/tailwind.js"></script>
</head>
<body class="text-sm">
  <div class="kit-shell">
    <aside class="kit-sidebar" data-kit-nav></aside>

    <main class="kit-content">
      <p class="kit-eyebrow">Atoms</p>
      <h1 class="page-title">Radio</h1>
      <p class="kit-meta">Spartan: <code>hlm-radio-group</code>, <code>hlm-radio</code> · shadcn: <code>radio-group.tsx</code></p>
      <p class="mt-4 max-w-2xl text-muted-foreground">Exactly one of 2–5 options, all visible at once. More than five: use a select. Group with a <code class="rounded-sm bg-muted px-1 py-0.5">fieldset</code> so the group has a name.</p>
      <div class="mt-6 rounded-lg border p-6">
        <div class="grid gap-6 sm:grid-cols-2">
          <fieldset class="field">
            <legend class="label mb-3">Product type</legend>
            <div class="radio-group">
              <label class="choice"><input class="radio" type="radio" name="pt" checked> Capital protection</label>
              <label class="choice"><input class="radio" type="radio" name="pt"> Yield enhancement</label>
              <label class="choice"><input class="radio" type="radio" name="pt"> Participation</label>
              <label class="choice"><input class="radio" type="radio" name="pt" disabled> Leverage (not available)</label>
            </div>
          </fieldset>
          <fieldset class="field">
            <legend class="label mb-3">Settlement</legend>
            <div class="radio-group">
              <label class="choice"><input class="radio" type="radio" name="st" checked>
                <span>Cash<span class="field-description block">Pays out in the product currency.</span></span></label>
              <label class="choice"><input class="radio" type="radio" name="st">
                <span>Physical<span class="field-description block">Delivers the underlying instrument.</span></span></label>
            </div>
          </fieldset>
        </div>
      </div>

      <nav class="kit-pager" data-kit-pager></nav>
    </main>
  </div>

  <script src="../../assets/kit-nav.js"></script>
  <script src="../../assets/app.js"></script>
</body>
</html>
